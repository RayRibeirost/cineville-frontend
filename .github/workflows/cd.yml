name: Build & Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build:
    name: Build e Publicar Imagem
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ghcr.io/qacoders-academy/smallville-front:latest
            ghcr.io/qacoders-academy/smallville-front:${{ github.sha }}

  deploy-vps:
    name: Deploy VPS (produção TQC)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.HOMELAB_GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /var/www/html/05-academy/smallville
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.yml pull frontend
            docker compose -f docker-compose.yml up -d --no-deps frontend
      - name: Healthcheck
        if: false 
        run: echo "pendente"
      - name: Rollback em caso de falha
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/html/05-academy/smallville
            export IMAGE_TAG=latest
            docker compose -f docker-compose.yml pull frontend
            docker compose -f docker-compose.yml up -d --no-deps frontend

  deploy-homelab:
    name: Deploy i3 (portfólio)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - name: Conectar na tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMELAB_HOST }}
          username: ${{ secrets.HOMELAB_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.HOMELAB_GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ~/cineville
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.yml pull frontend
            docker compose -f docker-compose.yml up -d --no-deps frontend
      - name: Healthcheck
        if: false
        run: echo "pendente"
      - name: Rollback em caso de falha
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMELAB_HOST }}
          username: ${{ secrets.HOMELAB_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          script: |
            cd ~/cineville
            export IMAGE_TAG=latest
            docker compose -f docker-compose.yml pull frontend
            docker compose -f docker-compose.yml up -d --no-deps frontend
