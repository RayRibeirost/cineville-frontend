name: Build & Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build:
    name: Build e Publicar Imagem
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Definir tag da imagem
        id: vars
        run: echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: |
            ghcr.io/rayribeirost/cineville-frontend:latest
            ghcr.io/rayribeirost/cineville-frontend:${{ steps.vars.outputs.image_tag }}

  deploy-homelab:
    name: Deploy i3 (Swarm)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Conectar na tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMELAB_HOST }}
          username: ${{ secrets.HOMELAB_USER }}
          key: ${{ secrets.HOMELAB_SSH_KEY }}
          script: |
            set -e

            IMAGE_TAG="${{ needs.build.outputs.image_tag }}"

            echo "${{ secrets.HOMELAB_GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            cd ~/cineville

            echo "Deploying frontend image: ${IMAGE_TAG}"

            export IMAGE_TAG="${IMAGE_TAG}"

            docker pull "ghcr.io/rayribeirost/cineville-frontend:${IMAGE_TAG}"

            docker stack deploy \
              --with-registry-auth \
              -c docker-compose.yml \
              cineville

            echo "Waiting for frontend convergence..."

            for i in {1..30}; do
              REPLICAS=$(docker service ls \
                --filter name=cineville_frontend \
                --format '{{.Replicas}}')

              echo "Frontend replicas: ${REPLICAS}"

              if [ "${REPLICAS}" = "2/2" ]; then
                break
              fi

              sleep 5
            done

            if [ "${REPLICAS}" != "2/2" ]; then
              echo "Frontend failed to converge."
              docker service ps cineville_frontend --no-trunc
              exit 1
            fi

            echo "Frontend deployment completed."

      - name: Rollback em caso de falha
        if: failure()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOMELAB_HOST }}
