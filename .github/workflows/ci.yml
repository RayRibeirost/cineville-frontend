name: CI (Continous integration pipeline) v2 - Frontend

on:
  push:
    branches:
      - '**'  
  pull_request:
    branches:
      - main

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  build:
    name: Build e Validação
    runs-on: ubuntu-latest   

    steps: 
      - name: Checkout 
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock
      
      - name: Instalar dependências
        run: yarn install --frozen-lockfile 

      - name: Lint
        run: yarn lint

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Build do Next.js  
        run: yarn build
        
  build_app_image:
    name: Build Image
    needs: build
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
      
    steps:
      - name: Checkout Code
        id: checkout_code
        uses: actions/checkout@v7
  
      - name: Criar .env temporário
        run: cp .env.exemple .env
  
      - name: Contornar o .dockerignore
        run: sed -i '/^\.env$/d' .dockerignore || true
  
      - name: Testar Build da Imagem Docker
        run: docker build -f dockerfile -t teste-imagem:latest .
